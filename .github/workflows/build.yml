name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compiler le plugin
        run: mvn -B package
      - name: Envoyer le .jar
        uses: actions/upload-artifact@v4
        with:
          name: PouvoirsRoulette
          path: target/*.jar
